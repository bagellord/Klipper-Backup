[homing_override]
gcode:
  status_homing
  {% if   not 'Z' in params and not 'Y' in params and     'X' in params %}
    G28 X
  {% elif not 'Z' in params and     'Y' in params and not 'X' in params %}
    G28 Y
  {% elif     'Z' in params and not 'Y' in params and not 'X' in params %}
    {% if printer.toolhead.homed_axes != "xy" %}
      G28 X
      G28 Y
    {% endif %}
    G0 X66 Y61.5
    G28 Z
  {% else %}
    G28 X
    G28 Y
    G0 X66 Y61.5
    G28 Z
  {% endif %}
  status_ready

[gcode_macro Z_TILT_ADJUST]
rename_existing: _Z_TILT_ADJUST
gcode:
  status_calibrating_z
  {% set hor_z = params.HORIZONTAL_MOVE_Z |default(5) %}
  {% set enf_l = params.ENFORCE_LIFT_SPEED|default(0) %}
  _Z_TILT_ADJUST HORIZONTAL_MOVE_Z={hor_z} ENFORCE_LIFT_SPEED={enf_l}
  status_ready